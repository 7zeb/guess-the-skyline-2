<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Skyline 2 — Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">

        <h1 class="title">Guess the Skyline 2</h1>

        <p>Made by Rutwik Wadekar (7Zeb)</p>

        <p id="question-number" class="question-number">Question: 1</p>

        <img id="skyline-img" class="skyline-img" src="" alt="Skyline">

        <div id="choices" class="choices"></div>

        <div class="button-row">
            <button id="submit-btn" class="main-btn">Submit</button>
            <button id="end-btn" class="main-btn">End Game</button>
        </div>

        <p id="feedback" class="feedback"></p>

        <div id="fact-box" class="fact-box" style="display:none;">
            <p id="fact-text"></p>
            <button id="next-btn" class="main-btn">Next</button>
        </div>

    </div>

    <!-- Background color loader -->
    <script>
        window.onload = function() {
            fetch("json/colors.json")
                .then(response => response.json())
                .then(data => {
                    const colors = data.colors;
                    const randomColor = colors[Math.floor(Math.random() * colors.length)];
                    document.body.style.background = randomColor;
                });
        };
    </script>

    <!-- Game Logic -->
<script>
    let answersData;
    let roastsData;
    let factsData;
    let currentIndex = 0;
    let questionNumber = 1;
    let selectedChoice = null;
    let hasAnswered = false; // Prevents scoring the same question multiple times

    // --- SCORE TRACKER INITIALIZATION ---
    let gameCounter = 0;
    let wrongGameCounter = 0;
    
    // Load global stats from localStorage, default to 0 if empty
    let globalCounter = parseInt(localStorage.getItem("globalCounter")) || 0;
    let wrongGlobalCounter = parseInt(localStorage.getItem("wrongGlobalCounter")) || 0;

    const skylineImg = document.getElementById("skyline-img");
    const choicesDiv = document.getElementById("choices");
    const feedback = document.getElementById("feedback");
    const factBox = document.getElementById("fact-box");
    const factText = document.getElementById("fact-text");
    const questionNumberDisplay = document.getElementById("question-number");

    function loadQuestion() {
        const entry = answersData.entries[currentIndex];
        skylineImg.src = entry.image;
        choicesDiv.innerHTML = "";
        feedback.textContent = "";
        factBox.style.display = "none";
        selectedChoice = null;
        hasAnswered = false; // Reset lock for the new question

        entry.choices.forEach(choice => {
            const btn = document.createElement("button");
            btn.className = "choice-btn";
            btn.textContent = choice;
            btn.onclick = () => {
                if (hasAnswered) return; // Freeze choices after submitting
                selectedChoice = choice;
                document.querySelectorAll(".choice-btn").forEach(b => {
                    b.classList.remove("selected");
                });
                btn.classList.add("selected");
            };
            choicesDiv.appendChild(btn);
        });
    }

    document.getElementById("submit-btn").onclick = () => {
        if (!selectedChoice) {
            feedback.textContent = "Pick an answer first.";
            return;
        }
        
        if (hasAnswered) {
            feedback.textContent = "You already answered this question! Click Next.";
            return;
        }

        const entry = answersData.entries[currentIndex];
        hasAnswered = true; // Lock the question

        if (selectedChoice === entry.answer) {
            // Correct Answer Actions
            gameCounter++;
            globalCounter++;
            localStorage.setItem("globalCounter", globalCounter); // Save to local storage

            feedback.textContent = "";
            factText.textContent = factsData[entry.answer];
            factBox.style.display = "block";
        } else {
            // Wrong Answer Actions
            wrongGameCounter++;
            wrongGlobalCounter++;
            localStorage.setItem("wrongGlobalCounter", wrongGlobalCounter); // Save to local storage

            const roast = roastsData.roasts[Math.floor(Math.random() * roastsData.roasts.length)];
            feedback.textContent = roast;
            
            // Show the next question box anyway so they can proceed
            factText.textContent = "Incorrect! The right answer was: " + entry.answer;
            factBox.style.display = "block";
        }
        
        // Debug logging to see it working in your browser console
        console.log(`Game Correct: ${gameCounter} | Global Correct: ${globalCounter}`);
        console.log(`Game Wrong: ${wrongGameCounter} | Global Wrong: ${wrongGlobalCounter}`);
    };

    document.getElementById("next-btn").onclick = () => {
        questionNumber++;
        questionNumberDisplay.textContent = "Question: " + questionNumber;

        const previousIndex = currentIndex;
        do {
            currentIndex = Math.floor(Math.random() * answersData.entries.length);
        } while (currentIndex === previousIndex && answersData.entries.length > 1);
        
        loadQuestion();
    };

        document.getElementById("end-btn").onclick = () => {
        // Save the final counts of this specific game so stats.html can read them
        localStorage.setItem("gameCounter", gameCounter);
        localStorage.setItem("wrongGameCounter", wrongGameCounter);
        
        window.location.href = "index.html"; // Or stats.html if you want to route straight there!
    };


    // Load all JSON files
    Promise.all([
        fetch("json/answers.json").then(r => r.json()),
        fetch("json/roasts.json").then(r => r.json()),
        fetch("json/facts.json").then(r => r.json())
    ]).then(([answers, roasts, facts]) => {
        answersData = answers;
        roastsData = roasts;
        factsData = facts;
        loadQuestion();
    });
</script>


</body>
</html>
